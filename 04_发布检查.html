<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>公众号发布检查清单</title>
  <style>
    :root {
      --ink: #122c34;
      --ink-2: #496168;
      --muted: #77888c;
      --line: #dce6e3;
      --paper: #f4f7f6;
      --panel: #fff;
      --nav: #0b2730;
      --nav-muted: #99b0b4;
      --green: #00a879;
      --green-dark: #08735e;
      --green-soft: #e6f7f1;
      --orange: #dd7c32;
      --orange-soft: #fff2e6;
      --shadow: 0 12px 28px rgba(14, 45, 53, .08);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(0, 168, 121, .26); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app { min-height: 100vh; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    .sidebar {
      min-height: 100vh;
      padding: 24px 20px;
      color: #fff;
      background: var(--nav);
    }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 34px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 7px; display: grid; place-items: center; color: var(--nav); background: #41dfb5; font-size: 21px; font-weight: 800; }
    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; margin-top: 3px; color: var(--nav-muted); font-size: 11px; }
    .side-kicker { margin: 0 0 10px; color: #b6c7ca; font-size: 11px; }
    .side-note { margin: 0; color: #9db3b7; font-size: 12px; line-height: 1.8; }
    .side-rule { height: 1px; margin: 26px 0; background: rgba(255,255,255,.12); }
    .side-list { margin: 0; padding: 0; list-style: none; counter-reset: check; }
    .side-list li { counter-increment: check; display: flex; gap: 10px; margin: 0 0 13px; color: #cbd8da; font-size: 12px; line-height: 1.45; }
    .side-list li::before { content: counter(check, decimal-leading-zero); color: #43ddb4; font-size: 10px; }

    main { min-width: 0; padding: 30px 34px 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.25; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .date { flex: none; color: var(--ink-2); font-size: 12px; }

    .summary { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; margin-bottom: 15px; }
    .progress-panel, .tip-panel { min-width: 0; padding: 17px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .progress-head strong { font-size: 14px; }
    .progress-count { color: var(--green-dark); font-size: 13px; font-weight: 700; }
    .progress-track { height: 9px; margin-top: 13px; border-radius: 5px; overflow: hidden; background: #e7efec; }
    .progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .2s ease; }
    .progress-caption { margin: 9px 0 0; color: var(--muted); font-size: 11px; }
    .tip-panel { background: var(--green-soft); }
    .tip-panel strong { display: block; margin-bottom: 6px; color: var(--green-dark); font-size: 12px; }
    .tip-panel p { margin: 0; color: #3f6f65; font-size: 11px; line-height: 1.6; }

    .checklist-panel { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
    .panel-head { min-height: 54px; padding: 0 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-head strong { font-size: 15px; }
    .panel-head span { color: var(--muted); font-size: 11px; }
    .checklist { padding: 8px 18px 16px; }
    .check-item { position: relative; border-bottom: 1px solid #edf1f0; }
    .check-item:last-child { border-bottom: 0; }
    .check-label { min-height: 63px; padding: 12px 4px; display: grid; grid-template-columns: 31px minmax(0,1fr) auto; align-items: center; gap: 10px; cursor: pointer; }
    .check-input { position: absolute; opacity: 0; pointer-events: none; }
    .check-box { width: 23px; height: 23px; border: 1.5px solid #b8c8c5; border-radius: 5px; display: grid; place-items: center; color: #fff; background: #fff; transition: background .16s ease, border-color .16s ease; }
    .check-box::after { content: "✓"; opacity: 0; transform: scale(.6); transition: opacity .16s ease, transform .16s ease; font-size: 15px; font-weight: 800; }
    .check-input:checked + .check-label .check-box { border-color: var(--green); background: var(--green); }
    .check-input:checked + .check-label .check-box::after { opacity: 1; transform: scale(1); }
    .check-input:checked + .check-label .check-copy strong { color: var(--green-dark); text-decoration: line-through; text-decoration-thickness: 1px; }
    .check-input:focus-visible + .check-label { outline: 3px solid rgba(0,168,121,.2); outline-offset: -3px; border-radius: 5px; }
    .check-copy { min-width: 0; }
    .check-copy strong { display: block; color: var(--ink); font-size: 13px; line-height: 1.5; }
    .check-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .check-index { min-width: 44px; padding: 4px 7px; border-radius: 4px; color: var(--muted); background: #f2f5f4; text-align: center; font-size: 10px; }
    .check-input:checked + .check-label .check-index { color: var(--green-dark); background: var(--green-soft); }

    .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 15px; }
    .save-note { color: var(--muted); font-size: 11px; }
    .action-group { display: flex; gap: 8px; }
    .btn { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink-2); background: var(--panel); cursor: pointer; font-size: 12px; }
    .btn:hover { border-color: #9fc3ba; color: var(--green-dark); background: #f6fbf9; }
    .btn-primary { border-color: var(--green); color: #fff; background: var(--green); }
    .btn-primary:hover { border-color: var(--green-dark); color: #fff; background: var(--green-dark); }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { min-height: 0; padding: 16px 18px 18px; }
      .brand { margin-bottom: 17px; }
      .side-rule, .side-list { display: none; }
      .side-note { max-width: 550px; }
      main { padding: 22px 18px 36px; }
    }
    @media (max-width: 560px) {
      .topbar { display: block; }
      h1 { font-size: 23px; }
      .date { display: block; margin-top: 10px; }
      .summary { grid-template-columns: 1fr; }
      .actions { align-items: flex-start; flex-direction: column; }
      .action-group { width: 100%; }
      .action-group .btn { flex: 1; }
      .check-label { grid-template-columns: 29px minmax(0,1fr); }
      .check-index { grid-column: 2; grid-row: 2; justify-self: start; margin-top: -4px; }
    }
  </style>
  <link rel="stylesheet" href="unified-theme.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="发布检查清单说明">
      <div class="brand"><div class="brand-mark" aria-hidden="true">✓</div><div><strong>公众号发布检查清单</strong><span>公众号发布工作台</span></div></div>
      <p class="side-kicker">发布前最后一分钟</p>
      <p class="side-note">每次发布前逐项核对，确保标题、素材、原创、带货和转载设置没有遗漏。</p>
      <div class="side-rule"></div>
      <ol class="side-list">
        <li>标题与原文标题一致</li>
        <li>广告设置已打开</li>
        <li>封面图清晰可用</li>
        <li>原创设置已打开</li>
        <li>已插入相关带货橱窗</li>
        <li>赞赏功能已打开</li>
        <li>快捷转载已关闭</li>
        <li>创作来源无需声明</li>
      </ol>
    </aside>

    <main>
      <header class="topbar">
        <div><h1>完成文章发布设置与发布前检查</h1><p class="subtitle">发布清单（每次发布前逐项核对，看看有没有遗漏）</p></div>
        <span class="date" id="todayText"></span>
      </header>

      <section class="summary" aria-live="polite">
        <div class="progress-panel">
          <div class="progress-head"><strong>当前检查进度</strong><span class="progress-count" id="progressCount">0 / 8</span></div>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
          <p class="progress-caption" id="progressCaption">开始逐项核对，完成后再发布。</p>
        </div>
        <div class="tip-panel"><strong>发布提醒</strong><p>设置检查完成后，再回到预览页确认排版和链接。</p></div>
      </section>

      <section class="checklist-panel" aria-labelledby="checklistTitle">
        <div class="panel-head"><strong id="checklistTitle">发布清单</strong><span>共 8 项</span></div>
        <div class="checklist" id="checklist"></div>
      </section>

      <div class="actions">
        <span class="save-note" id="saveNote">勾选状态会自动保存在本机</span>
        <div class="action-group"><button class="btn" type="button" id="clearBtn">清空勾选</button><button class="btn btn-primary" type="button" id="completeBtn">全部标记完成</button></div>
      </div>
    </main>
  </div>

  <script>
    const checklistItems = [
      {title:'标题是否和原文标题一模一样',desc:'发布前逐字核对标题，避免标题、导语和正文不一致。'},
      {title:'广告设置是否打开',desc:'确认文章的广告设置已按本次发布要求开启。'},
      {title:'封面图是否清晰能用',desc:'检查封面图清晰度、主体完整性和手机端裁切效果。'},
      {title:'原创是否打开',desc:'确认原创声明已打开，并检查文章是否符合原创发布要求。'},
      {title:'文章是否插入相关带货橱窗',desc:'如文章涉及商品推荐，确认相关带货橱窗已正确插入。'},
      {title:'文章是否打开赞赏功能',desc:'确认赞赏功能开关状态符合本次文章的发布安排。'},
      {title:'快捷转载是否关闭',desc:'确认快捷转载已关闭，避免文章被直接转载后失去管理。'},
      {title:'创作来源：无需声明即可',desc:'确认创作来源设置符合当前发布要求，无需声明时保持免声明。'}
    ];
    const storageKey = 'mini-voyage-wechat-publish-checklist-v1';
    const checklist = document.getElementById('checklist');
    const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const states = checklistItems.map((_, index) => Boolean(saved[index]));

    checklist.innerHTML = checklistItems.map((item, index) => `<div class="check-item"><input class="check-input" type="checkbox" id="check-${index}" ${states[index] ? 'checked' : ''}><label class="check-label" for="check-${index}"><span class="check-box" aria-hidden="true"></span><span class="check-copy"><strong>${index + 1}.${item.title}</strong><span>${item.desc}</span></span><span class="check-index">${String(index + 1).padStart(2, '0')} / 08</span></label></div>`).join('');

    function renderProgress() {
      const done = states.filter(Boolean).length;
      const percent = done / checklistItems.length * 100;
      document.getElementById('progressCount').textContent = `${done} / ${checklistItems.length}`;
      document.getElementById('progressBar').style.width = `${percent}%`;
      document.getElementById('progressCaption').textContent = done === checklistItems.length ? '8 项已完成，可以进入最终预览。' : done ? `已完成 ${done} 项，还有 ${checklistItems.length - done} 项待核对。` : '开始逐项核对，完成后再发布。';
      localStorage.setItem(storageKey, JSON.stringify(states));
      document.getElementById('saveNote').textContent = `最近保存：${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`;
    }

    checklist.addEventListener('change', (event) => {
      const input = event.target.closest('.check-input');
      if (!input) return;
      const index = Number(input.id.replace('check-', ''));
      states[index] = input.checked;
      renderProgress();
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      states.fill(false);
      checklist.querySelectorAll('.check-input').forEach(input => { input.checked = false; });
      renderProgress();
    });
    document.getElementById('completeBtn').addEventListener('click', () => {
      states.fill(true);
      checklist.querySelectorAll('.check-input').forEach(input => { input.checked = true; });
      renderProgress();
    });
    document.getElementById('todayText').textContent = new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
    renderProgress();
  </script>
</body>
</html>
