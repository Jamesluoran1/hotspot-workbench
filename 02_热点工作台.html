<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>热点工作台</title>
  <style>
    :root {
      --ink: #102b34;
      --ink-2: #38525a;
      --muted: #718186;
      --line: #dbe2e0;
      --paper: #f5f7f6;
      --panel: #ffffff;
      --nav: #0b252e;
      --nav-muted: #91a8ad;
      --green: #00b884;
      --cyan: #13b9d4;
      --orange: #e48334;
      --focus: #087f68;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(0, 184, 132, .28);
      outline-offset: 2px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
    .sidebar {
      min-height: 100vh;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      padding: 22px 16px;
      background: var(--nav);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 8px; }
    .brand img { width: 39px; height: 39px; display: block; }
    .brand-name { min-width: 0; }
    .brand-name strong { display: block; font-size: 17px; font-weight: 700; }
    .brand-name span { display: block; margin-top: 3px; color: var(--nav-muted); font-size: 11px; }

    .nav-label { padding: 0 10px; color: var(--nav-muted); font-size: 11px; }
    .category-nav { display: grid; gap: 4px; }
    .category-btn {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c8d5d7;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .category-btn:hover { background: rgba(255, 255, 255, .07); color: #fff; }
    .category-btn[aria-pressed="true"] { color: #fff; background: rgba(19, 185, 212, .17); }
    .nav-icon { width: 22px; color: var(--nav-muted); font-size: 15px; text-align: center; }
    .category-btn[aria-pressed="true"] .nav-icon { color: #42e1bd; }
    .nav-count { margin-left: auto; color: var(--nav-muted); font-size: 11px; }
    .sidebar-foot { margin-top: auto; padding: 13px 10px 0; border-top: 1px solid rgba(255,255,255,.11); color: var(--nav-muted); font-size: 11px; line-height: 1.7; }

    main { min-width: 0; padding: 24px 28px 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .title-wrap h1 { margin: 0; font-size: 27px; line-height: 1.25; letter-spacing: 0; }
    .title-wrap p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .date-chip { flex: none; color: var(--ink-2); font-size: 12px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }
    .search-wrap { position: relative; }
    .search-symbol { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #search {
      width: 100%;
      height: 44px;
      padding: 0 42px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: var(--panel);
    }
    #search::placeholder { color: #9ba8ab; }
    .clear-search {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      display: none;
    }
    .clear-search:hover { background: #eef2f1; color: var(--ink); }
    .clear-search.visible { display: block; }

    .segmented {
      height: 44px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      display: flex;
      gap: 2px;
    }
    .segment {
      min-width: 58px;
      padding: 0 11px;
      border: 0;
      border-radius: 5px;
      color: var(--ink-2);
      background: transparent;
      cursor: pointer;
    }
    .segment:hover { background: #eef3f2; }
    .segment[aria-pressed="true"] { color: #fff; background: var(--ink); }
    .region-select {
      height: 44px;
      padding: 0 36px 0 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink-2);
      background: var(--panel);
    }

    .workspace-meta {
      min-height: 32px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .workspace-meta strong { font-size: 15px; }
    .result-count { color: var(--muted); font-size: 12px; }
    .active-filter { color: var(--focus); }

    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 12px;
      align-items: stretch;
    }
    .site-card {
      min-width: 0;
      min-height: 126px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      position: relative;
      transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .site-card:hover { border-color: #aebdba; box-shadow: 0 5px 18px rgba(16, 43, 52, .08); transform: translateY(-1px); }
    .site-link { min-height: 124px; padding: 16px 48px 14px 15px; color: inherit; text-decoration: none; display: block; }
    .site-head { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .site-logo {
      flex: none;
      width: 36px;
      height: 36px;
      border: 1px solid #e5eae9;
      border-radius: 7px;
      background: #f2f5f4;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-weight: 700;
      font-size: 13px;
    }
    .site-logo img { width: 22px; height: 22px; object-fit: contain; display: block; }
    .site-title { min-width: 0; }
    .site-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .site-domain { margin-top: 3px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site-desc { margin: 13px 0 0; color: var(--ink-2); font-size: 12px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .site-tag { display: inline-flex; margin-top: 9px; padding: 2px 7px; border-radius: 4px; color: #287063; background: #e9f6f2; font-size: 10px; }
    .favorite-btn {
      position: absolute;
      top: 11px;
      right: 10px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 6px;
      color: #8c9a9d;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .favorite-btn:hover { color: var(--orange); background: #fff5eb; }
    .favorite-btn[aria-pressed="true"] { color: var(--orange); }
    .favorite-btn::after {
      content: attr(data-tip);
      position: absolute;
      z-index: 3;
      right: 0;
      top: 40px;
      width: max-content;
      max-width: 150px;
      padding: 5px 7px;
      border-radius: 4px;
      color: #fff;
      background: var(--ink);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .12s ease, transform .12s ease;
    }
    .favorite-btn:hover::after, .favorite-btn:focus-visible::after { opacity: 1; transform: translateY(0); }

    .empty { grid-column: 1 / -1; padding: 64px 20px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 16px; }

    @media (max-width: 900px) {
      .app { width: 100%; min-width: 0; grid-template-columns: minmax(0, 1fr); overflow-x: hidden; }
      .sidebar { min-width: 0; min-height: auto; padding: 14px 16px 10px; gap: 12px; }
      .sidebar { height: auto; position: static; overflow: hidden; }
      .brand { padding: 0; }
      .brand img { width: 34px; height: 34px; }
      .brand-name span, .sidebar-foot, .nav-label { display: none; }
      .category-nav { width: 100%; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 3px; scrollbar-width: thin; }
      .category-btn { flex: 0 0 auto; width: auto; height: 34px; padding: 0 11px; background: rgba(255,255,255,.05); }
      .nav-icon, .nav-count { display: none; }
      main { padding: 20px 18px 32px; }
    }
    @media (max-width: 680px) {
      .topbar { align-items: flex-start; }
      .title-wrap h1 { font-size: 23px; }
      .date-chip { display: none; }
      .toolbar { grid-template-columns: 1fr; }
      .segmented { width: 100%; }
      .segment { flex: 1; }
      .region-select { width: 100%; }
      .site-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="unified-theme.css">
</head>
<body>
  <div class="app">

      </div>

          <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索">×</button>
        </label>
        <div class="segmented" aria-label="视图">
          <button class="segment" type="button" data-view="all" aria-pressed="true">全部</button>
          <button class="segment" type="button" data-view="favorites" aria-pressed="false">收藏</button>
          <button class="segment" type="button" data-view="recent" aria-pressed="false">最近</button>
        </div>
        <label>
          <span class="sr-only">区域筛选</span>
          <select class="region-select" id="regionFilter">
            <option value="all">全部区域</option>
            <option value="cn">国内</option>
            <option value="global">海外</option>
            <option value="tools">开源工具</option>
          </select>
        </label>
      </section>

      <div class="workspace-meta">
        <strong id="sectionTitle">全部网站</strong>
        <span class="result-count" id="resultCount"></span>
      </div>
      <section class="site-grid" id="siteGrid" aria-live="polite"></section>
    </main>
  </div>

    const categories = [
      ['全部网站','◫'],['公众号综合热榜','↗'],['公众号对标','◎'],['政策权威','◆'],['财经商业','¥'],
      ['科技AI','⌁'],['品牌营销','◇'],['数据趋势','↝'],['海外出海','◉'],['垂直行业','▦'],['开源工具','⌘']
    ];
    const state = { category:'全部网站', view:'all', region:'all', query:'' };
    const favorites = new Set(JSON.parse(localStorage.getItem('hotspot-favorites') || '[]'));
    let recent = JSON.parse(localStorage.getItem('hotspot-recent') || '[]');

    const nav = document.getElementById('categoryNav');
    const grid = document.getElementById('siteGrid');
    const search = document.getElementById('search');
    const clearSearch = document.getElementById('clearSearch');
    const resultCount = document.getElementById('resultCount');
    const sectionTitle = document.getElementById('sectionTitle');
    const regionFilter = document.getElementById('regionFilter');

    document.getElementById('today').textContent = new Intl.DateTimeFormat('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());
    document.getElementById('totalSites').textContent = `${sites.length} 个网站`;

    const categoryCount = name => name === '全部网站' ? sites.length : sites.filter(s => s.c === name).length;
    categories.forEach(([name, icon]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'category-btn';
      btn.dataset.category = name;
      btn.setAttribute('aria-pressed', name === state.category ? 'true' : 'false');
      btn.innerHTML = `<span class="nav-icon" aria-hidden="true">${icon}</span><span>${name}</span><span class="nav-count">${categoryCount(name)}</span>`;
      btn.addEventListener('click', () => {
        state.category = name;
        document.querySelectorAll('.category-btn').forEach(el => el.setAttribute('aria-pressed', String(el === btn)));
        render();
      });
      nav.appendChild(btn);
    });

    document.querySelectorAll('.segment').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        document.querySelectorAll('.segment').forEach(el => el.setAttribute('aria-pressed', String(el === btn)));
        render();
      });
    });

    search.addEventListener('input', () => {
      state.query = search.value.trim().toLowerCase();
      clearSearch.classList.toggle('visible', Boolean(state.query));
      render();
    });
    clearSearch.addEventListener('click', () => {
      search.value = '';
      state.query = '';
      clearSearch.classList.remove('visible');
      search.focus();
      render();
    });
    regionFilter.addEventListener('change', () => { state.region = regionFilter.value; render(); });

    function saveFavorites() {
      localStorage.setItem('hotspot-favorites', JSON.stringify([...favorites]));
    }
    function visit(url) {
      recent = [url, ...recent.filter(item => item !== url)].slice(0, 20);
      localStorage.setItem('hotspot-recent', JSON.stringify(recent));
    }
    function favicon(url) {
      const domain = new URL(url).hostname;
      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
    }
    function domain(url) { return new URL(url).hostname.replace(/^www\./, ''); }
    function initials(name) { return name.replace(/[\s·.]/g,'').slice(0,2).toUpperCase(); }

    function filteredSites() {
      let list = sites.filter(site => state.category === '全部网站' || site.c === state.category);
      if (state.region !== 'all') list = list.filter(site => site.r === state.region);
      if (state.view === 'favorites') list = list.filter(site => favorites.has(site.u));
      if (state.view === 'recent') {
        const order = new Map(recent.map((url, index) => [url, index]));
        list = list.filter(site => order.has(site.u)).sort((a,b) => order.get(a.u) - order.get(b.u));
      }
      if (state.query) {
        list = list.filter(site => `${site.n} ${site.c} ${site.d} ${site.t} ${domain(site.u)}`.toLowerCase().includes(state.query));
      }
      return list;
    }

    function render() {
      const list = filteredSites();
      grid.innerHTML = '';
      sectionTitle.textContent = state.category;
      const labels = [];
      if (state.view === 'favorites') labels.push('收藏');
      if (state.view === 'recent') labels.push('最近访问');
      if (state.region !== 'all') labels.push(regionFilter.options[regionFilter.selectedIndex].text);
      if (state.query) labels.push(`“${search.value.trim()}”`);
      resultCount.innerHTML = `<span class="${labels.length ? 'active-filter' : ''}">${labels.join(' · ')}</span>${labels.length ? ' · ' : ''}${list.length} 个结果`;

      if (!list.length) {
        grid.innerHTML = `<div class="empty"><strong>没有匹配的网站</strong><span>调整分类、区域或搜索词后再试</span></div>`;
        return;
      }

      list.forEach(site => {
        const card = document.createElement('article');
        card.className = 'site-card';
        const isFavorite = favorites.has(site.u);
        card.innerHTML = `
          <a class="site-link" href="${site.u}" target="_blank" rel="noopener noreferrer" aria-label="打开 ${site.n}">
            <div class="site-head">
              <span class="site-logo"><span>${initials(site.n)}</span><img src="${favicon(site.u)}" alt="" loading="lazy"></span>
              <span class="site-title"><strong>${site.n}</strong><span class="site-domain">${domain(site.u)}</span></span>
            </div>
            <p class="site-desc">${site.d}</p>
            <span class="site-tag">${site.t}</span>
          </a>
          <button class="favorite-btn" type="button" aria-label="${isFavorite ? '取消收藏' : '收藏'} ${site.n}" aria-pressed="${isFavorite}" data-tip="${isFavorite ? '取消收藏' : '收藏'}">${isFavorite ? '★' : '☆'}</button>`;
        const img = card.querySelector('img');
        img.addEventListener('load', () => { img.previousElementSibling.style.display = 'none'; });
        img.addEventListener('error', () => { img.style.display = 'none'; });
        card.querySelector('.site-link').addEventListener('click', () => visit(site.u));
        card.querySelector('.favorite-btn').addEventListener('click', event => {
          event.stopPropagation();
          favorites.has(site.u) ? favorites.delete(site.u) : favorites.add(site.u);
          saveFavorites();
          render();
        });
        grid.appendChild(card);
      });
    }

    render();
  </script>
</body>
</html>
